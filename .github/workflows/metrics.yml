name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ed-radanovis
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo

          # Linguagens do repositório específico
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_analysis_timeout: 20
          plugin_languages_categories: programming
          plugin_languages_recent_days: 0
          plugin_languages_threshold: 0%

          # Repositório que você quer analisar
          repositories: |
            ed-radanovis/Engenharia_Software_Repositorio_Central-01-2025_a_10-2028

          filename: github-metrics.svg
