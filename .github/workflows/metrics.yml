name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ed-radanovis
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo

          # ----------------------------------------------------
          # ESSENCIAL → Obriga a escolher os repositórios usados
          # ----------------------------------------------------
          plugin_repositories: yes
          plugin_repositories_affiliations: owner
          plugin_repositories_featured: |
            ed-radanovis/Engenharia_Software_Repositorio_Central-01-2025_a_10-2028

          # ----------------------------------------------------
          # Linguagens — agora vai obedecer o repositório acima
          # ----------------------------------------------------
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_analysis_timeout: 20
          plugin_languages_threshold: 0%
          plugin_languages_recent_days: 0
          plugin_languages_indepth: yes

          filename: github-metrics.svg
